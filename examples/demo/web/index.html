<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo shop</title>
<style>
  :root { --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --text: #e6e8ee; --muted: #8b93a7; --lane: #7c5cff; --base: #3a4150; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); display: grid; place-items: center; min-height: 100vh; }
  main { width: min(760px, 92vw); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--base); }
  .badge.lane { background: var(--lane); }
  .chain { display: flex; align-items: stretch; gap: 10px; }
  .hop { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; border-top: 4px solid var(--base); }
  .hop.lane { border-color: var(--lane); border-top-color: var(--lane); background: #1e1a33; }
  .hop h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .hop .who { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .arrow { align-self: center; color: var(--muted); }
  button { margin-top: 18px; background: var(--lane); color: white; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer; }
  p.hint { color: var(--muted); font-size: 13px; }
  code { background: var(--card); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Demo shop</h1>
    <span id="badge" class="badge">baseline UI</span>
  </header>
  <div id="chain" class="chain"></div>
  <button id="call">Call the API again</button>
  <p class="hint">
    Each box is one service instance that handled the request. Purple ones run from a lane;
    grey ones are the shared baseline. The API is called at <code>%API_URL%</code> either way:
    the lanes router picks the instances from where the request came from.
  </p>
</main>
<script>
  const lane = '%LANE_NAME%';
  if (lane) {
    const b = document.getElementById('badge');
    b.textContent = `lane: ${lane}`;
    b.classList.add('lane');
  }
  async function call() {
    const chain = document.getElementById('chain');
    try {
      let node = await (await fetch('%API_URL%/api/checkout')).json();
      const hops = [];
      while (node) {
        hops.push(node);
        node = node.calls;
      }
      chain.innerHTML = hops.map((h) => `
        <div class="hop ${h.lane ? 'lane' : ''}">
          <h2>${h.service}</h2>
          <div>${h.message ?? h.error}</div>
          <div class="who">${h.lane ? `lane ${h.lane}` : 'baseline'}</div>
        </div>`).join('<div class="arrow">&rarr;</div>');
    } catch (e) {
      chain.innerHTML = `<div class="hop">Could not reach the API at %API_URL% (${e.message}). Is the baseline up?</div>`;
    }
  }
  document.getElementById('call').onclick = call;
  call();
</script>
</body>
</html>
